[project]
name = "audio-metadata-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mutagen>=1.48.1",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "torchvision>=0.29.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_metadata_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
